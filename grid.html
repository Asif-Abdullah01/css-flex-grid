<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout</title>


    <style>

        .container{
            display: grid;
            /* grid-template-columns: 150px 300px 150px; */
            /* grid-template-columns: repeat(3, 150px); */

            /* grid-template-columns: repeat(3, 1fr); */
            /* grid-template-columns: repeat(3, 1fr) 2fr 4fr; */



            /* grid-template-columns: 200px 1fr 100px; */
            grid-template-columns: 100px auto;

            /* grid-template-columns: auto 1fr auto; */
            gap: 10px;
        }

        .box{
            border: 2px solid red;
            font-size: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;

        }
        
    </style>
</head>
<body>
    <div class="container">
        <div class="box">box - 1</div>
        <div class="box">box - 2</div>
        <div class="box">box - 3</div>
        <div class="box">box - 4</div>
        <div class="box">box - 5</div>
        <div class="box">box - 6</div>
        <div class="box">box - 7</div>
        <div class="box">box - 8</div>
        <div class="box">box - 9</div>
        <div class="box">box - 10</div>
        <div class="box">box - 11</div>
        <div class="box">box - 12</div>
        <div class="box">box - 13</div>
        <div class="box">box - 14</div>
        <div class="box">box - 15</div>
        <div class="box">box - 16</div>
        <div class="box">box - 17</div>
        <div class="box">box - 18</div>
        <div class="box">box - 19</div>
        <div class="box">box - 20</div>
        <div class="box">box - 21</div>
    </div>
</body>
</html>
